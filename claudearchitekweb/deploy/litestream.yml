# Continuous replication of the SQLite database to Cloudflare R2 (or any S3-compatible bucket).
# Docs: https://litestream.io/guides/s3/
dbs:
  - path: /app/data/architeksoft.db
    replicas:
      - type: s3
        bucket: architeksoft-db-backups
        path: architeksoft
        endpoint: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
        region: auto
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 720h
        sync-interval: 10s
