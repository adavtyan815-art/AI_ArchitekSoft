# Production layout: Caddy (HTTPS) → web (Next.js + in-app worker). Data lives in the named volume.
# Usage (from claudearchitekweb/):  docker compose -f deploy/docker-compose.yml up -d --build
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/architeksoft.db
      UPLOAD_DIR: /app/data/uploads
      RUN_WORKER_IN_APP: "true"
    volumes:
      - appdata:/app/data
    expose:
      - "3100"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:-new.architeksoft.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Optional: run the worker as a separate process. Set RUN_WORKER_IN_APP=false on `web` when enabling.
  worker:
    profiles: ["split-worker"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/architeksoft.db
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - appdata:/app/data
    command: ["node", "--import", "tsx", "scripts/worker.ts"]

  # Optional: continuous SQLite backup to S3-compatible storage (Cloudflare R2). Fill litestream.yml first.
  litestream:
    profiles: ["backup"]
    image: litestream/litestream:0.3
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - appdata:/app/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: ["replicate"]

volumes:
  appdata:
  caddy_data:
  caddy_config:
